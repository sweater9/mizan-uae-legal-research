name: PR browser preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify preview entry point
        run: test -f index.html

      - name: Publish browser preview link
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- mizan-pr-browser-preview -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const previewUrl = `https://raw.githack.com/${owner}/${repo}/${sha}/index.html`;
            const body = `${marker}\n### Browser preview\n\n[Open PR #${pr.number} preview](${previewUrl})\n\nThis preview is served from the exact PR head commit \`${sha.slice(0, 7)}\` and does **not** deploy to or overwrite the production GitHub Pages site. It updates automatically when new commits are pushed to this PR.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100
            });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
