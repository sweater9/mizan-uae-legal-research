name: Validate static regulatory data

on:
  push:
    branches:
      - 'agent/static-data-phase0'
    paths:
      - 'app.js'
      - 'content-2026.js'
      - 'content-details.js'
      - 'content-upgrade-aug2026.js'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-static-data.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'content-2026.js'
      - 'content-details.js'
      - 'content-upgrade-aug2026.js'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-static-data.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and generate lockfile
        run: npm install --ignore-scripts

      - name: Commit generated package-lock.json on preview branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/static-data-phase0'
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already committed and unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm package lock"
            git push origin HEAD:agent/static-data-phase0
          fi

      - name: Migrate and validate data
        run: npm run check:data

      - name: Build FlexSearch indexes
        run: npm run build:index

      - name: Confirm generated artifacts
        run: |
          test -s data/index.json
          test -s data/search-index-en.json
          test -s data/search-index-ar.json
          count=$(find data/legislation -type f -name '*.json' | wc -l)
          test "$count" -gt 0
          echo "Validated $count legislation files"
