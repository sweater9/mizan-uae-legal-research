name: Validate regulatory data

on:
  push:
    paths:
      - 'app.js'
      - 'content-*.js'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'content-*.js'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build static regulatory data
        run: npm run build:data

      - name: Verify generated JSON
        run: |
          node -e "const fs=require('fs'); const p='data/index.json'; const d=JSON.parse(fs.readFileSync(p,'utf8')); if(!Array.isArray(d)||!d.length) process.exit(1); console.log('Validated',d.length,'instruments');"

      - name: Upload generated data artifact
        uses: actions/upload-artifact@v4
        with:
          name: mizan-static-data
          path: |
            data/index.json
            data/legislation/*.json
            data/search-index-*.json
